LABEL arch_nbd
TEXT HELP
Boot the GamerX OS install medium using NBD.
It allows you to install GamerX OS or perform system maintenance.
ENDTEXT
MENU LABEL GamerX OS install medium (%ARCH%, NBD)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% quiet splash loglevel=3 udev.log_level=3 vt.global_cursor_default=0 archisosearchuuid=%ARCHISO_UUID% archiso_nbd_srv=${pxeserver} cms_verify=y
SYSAPPEND 3

