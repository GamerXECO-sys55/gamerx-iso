# GamerX OS · live ISO mkinitcpio config (with Plymouth)
# Verified pattern from AxOS production ISO.
# 'plymouth' hook MUST come right after 'udev'.
# MODULES line forces KMS drivers for both physical hardware (intel/amd/nvidia)
# and virtual machines (virtio_gpu, qxl, bochs_drm) so Plymouth has a framebuffer
# to draw on within ms of boot — avoids the 1-2s blank gap before the splash.
MODULES=(i915 amdgpu radeon nouveau virtio_gpu qxl bochs)
BINARIES=()
FILES=()
HOOKS=(base udev plymouth keymap consolefont modconf memdisk archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs kms block filesystems keyboard)
COMPRESSION="xz"
