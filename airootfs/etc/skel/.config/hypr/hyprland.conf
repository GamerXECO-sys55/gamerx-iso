# GamerX OS · default Hyprland config (skel for new users + live env)
# Sources the system-shipped configs from /usr/share/gamerx-shell/hyprland/
# and applies the user state. Personal tweaks go in ~/.config/hypr/local/

source = /usr/share/gamerx-shell/hyprland/00-monitors.conf
source = /usr/share/gamerx-shell/hyprland/10-input.conf
source = /usr/share/gamerx-shell/hyprland/20-environment.conf
source = /usr/share/gamerx-shell/hyprland/30-decoration.conf
source = ~/.config/hypr/density.conf
source = ~/.config/hypr/animations.conf
source = /usr/share/gamerx-shell/hyprland/50-keybinds.conf
source = /usr/share/gamerx-shell/hyprland/60-rules.conf
source = /usr/share/gamerx-shell/hyprland/70-autostart.conf
source = /usr/share/gamerx-shell/hyprland/80-aria.conf
source = ~/.config/hypr/local/*.conf
