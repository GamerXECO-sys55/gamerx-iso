# GamerX OS · default user Hyprland config (Sleex-pattern: system first, custom last).
# All system defaults live in /usr/share/gamerx-shell/hyprland/. Personal tweaks
# go in ~/.config/hypr/custom/ — files there override the defaults.
#
# Density / animation are managed by `gamerx-theme` and live in /usr/share/gamerx-shell/.

source = /usr/share/gamerx-shell/hyprland/00-monitors.conf
source = /usr/share/gamerx-shell/hyprland/10-input.conf
source = /usr/share/gamerx-shell/hyprland/20-environment.conf
source = /usr/share/gamerx-shell/hyprland/30-decoration.conf
source = /usr/share/gamerx-shell/hyprland/animations/smooth.conf
source = /usr/share/gamerx-shell/hyprland/density/comfortable.conf
source = /usr/share/gamerx-shell/hyprland/50-keybinds.conf
source = /usr/share/gamerx-shell/hyprland/60-rules.conf
source = /usr/share/gamerx-shell/hyprland/70-autostart.conf
source = /usr/share/gamerx-shell/hyprland/80-aria.conf

# User overrides — empty by default; create files here to override anything above.
# Example:  echo '$mainMod = ALT' > ~/.config/hypr/custom/mod.conf
source = ~/.config/hypr/custom/

# State-driven overrides written by gamerx-theme (when user changes density/animation
# from the defaults). These files only exist after the user runs gamerx-theme set,
# so we don't `source` them by default — gamerx-theme writes the symlinks above instead.
