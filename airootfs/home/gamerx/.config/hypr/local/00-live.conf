# GamerX OS · live-environment Hyprland tweaks
# Sourced last via the user-overrides include in /etc/skel hyprland.conf.

# Welcome notification — pops in 4 seconds after Hyprland boots so the user
# discovers the installer immediately.
exec-once = sleep 4 && notify-send -i gamerx-os "Welcome to GamerX OS Live" "Press SUPER+I or click the desktop icon to install. SUPER+ENTER for terminal."

# Show desktop icons (Nautilus background)
exec-once = nautilus --no-default-window &
