# GamerX OS · live-environment Hyprland tweaks
# Sourced last via the user-overrides include in /etc/skel hyprland.conf.

# Welcome notification — pops in 4 seconds after Hyprland boots so the user
# discovers the installer immediately. No nautilus auto-opening.
exec-once = sleep 4 && notify-send -i system-software-install "Welcome to GamerX OS Live" "Press SUPER+I or click the desktop icon to install GamerX OS. SUPER+ENTER for a terminal."
